name: Deploy to Staging

on:
  push:
    branches: [ Apurba, Andreas ]
  workflow_dispatch:  # Allow manual trigger

env:
  NAMESPACE: staging
  
jobs:
  deploy-staging:
    name: Deploy to Docker Desktop Staging
    runs-on: self-hosted  # Must run on your Windows machine with kubectl access
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify Docker Desktop Kubernetes
        shell: powershell
        run: |
          kubectl version --client
          kubectl cluster-info

          # Verify we're using docker-desktop context
          $context = kubectl config current-context

          if ($context -ne "docker-desktop") {
              Write-Host "❌ Not using docker-desktop context. Current: $context"
              Write-Host "Switch with: kubectl config use-context docker-desktop"
              exit 1
          }

          Write-Host "✅ Using Docker Desktop Kubernetes"

      
      - name: Build images with docker-compose
        shell: powershell
        run: |
          Write-Host "🏗️ Building Docker images with docker-compose..."

          docker-compose build

          Write-Host "✅ Build completed"


      - name: Tag images for staging
        shell: powershell
        run: |
          Write-Host "🏷️ Tagging images for staging..."

          docker tag energy-orchestrator:latest energy-orchestrator:staging
          docker tag energy-xgb:latest energy-xgb:staging
          docker tag energy-hw:latest energy-hw:staging
          docker tag energy-gui:latest energy-gui:staging

          Write-Host "✅ Images tagged"


      - name: Verify images available
        shell: powershell
        run: |
          Write-Host "📦 Verifying images..."

          docker images | Select-String "energy"

          Write-Host "✅ Images available to Kubernetes"


      - name: Create/Update Namespace
        shell: powershell
        run: |
          kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace $env:NAMESPACE environment=staging --overwrite


      - name: Create ConfigMap
        shell: powershell
        run: |
          kubectl create configmap app-config `
            --from-literal=ENV=staging `
            --from-literal=LOG_LEVEL=INFO `
            --from-literal=API_URL=http://api-service:8000 `
            --from-literal=XGB_SERVICE_URL=http://xgb-service:8001 `
            --from-literal=HW_SERVICE_URL=http://hw-service:8002 `
            --namespace=$env:NAMESPACE `
            --dry-run=client -o yaml | kubectl apply -f -


      - name: Update deployment manifests
        shell: powershell
        run: |
          Write-Host "Updating deployment manifest for staging..."

          $content = Get-Content k8s/deployment.yaml -Raw
          $content = $content -replace ':latest', ':staging'
          $content = $content -replace 'imagePullPolicy:\s*Always', 'imagePullPolicy: Never'

          $content | Out-File k8s/deployment-staging.yaml -Encoding utf8

          Write-Host "✅ Deployment manifest updated"

      - name: Deploy Services
        shell: powershell
        run: |
          Write-Host "🚀 Deploying to staging namespace..."

          kubectl apply -f k8s/deployment-staging.yaml --namespace=$env:NAMESPACE
          kubectl apply -f k8s/service.yaml --namespace=$env:NAMESPACE

          Write-Host "✅ Manifests applied"


      - name: Wait for Rollout
        shell: powershell
        run: |
          Write-Host "⏳ Waiting for deployments to complete..."

          kubectl rollout status deployment/api-deployment `
            --namespace=$env:NAMESPACE --timeout=5m

          kubectl rollout status deployment/xgb-deployment `
            --namespace=$env:NAMESPACE --timeout=5m

          kubectl rollout status deployment/hw-deployment `
            --namespace=$env:NAMESPACE --timeout=5m

          kubectl rollout status deployment/gui-deployment `
            --namespace=$env:NAMESPACE --timeout=5m


      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "🔍 Verifying deployment..."

          kubectl get pods --namespace=$env:NAMESPACE
          kubectl get services --namespace=$env:NAMESPACE


      - name: Run Smoke Tests
        shell: powershell
        run: |
          Write-Host "🧪 Running smoke tests..."

          Start-Sleep -Seconds 30  # Wait for services to be fully ready

          # Test orchestrator health
          try {
              kubectl run smoke-test-health `
                --image=curlimages/curl `
                --rm -i --restart=Never `
                --namespace=$env:NAMESPACE `
                -- curl -f http://api-service:8000/health
          } catch {
              Write-Host "❌ Health check failed"
              kubectl logs -l app=api-gateway --tail=50 --namespace=$env:NAMESPACE
              exit 1
          }

          # Test forecast endpoint
          try {
              kubectl run smoke-test-forecast `
                --image=curlimages/curl `
                --rm -i --restart=Never `
                --namespace=$env:NAMESPACE `
                -- curl -f "http://api-service:8000/forecast/optimized/DE?carbon_mode=LOW"
          } catch {
              Write-Host "❌ Forecast endpoint failed"
              exit 1
          }


      - name: Get Access URL
        shell: powershell
        run: |
          Write-Host "✅ Staging deployment successful!"
          Write-Host ""
          Write-Host "📍 Access URLs (Docker Desktop):"
          Write-Host "   GUI: http://localhost:30001"
          Write-Host "   API: http://localhost:30000"
          Write-Host ""
          Write-Host "🔍 Check status: kubectl get all -n staging"


      - name: Cleanup temp files
        shell: powershell
        run: |
          if (Test-Path k8s/deployment-staging.yaml) {
              Remove-Item k8s/deployment-staging.yaml -Force
          }


      - name: Notify on Failure
        if: failure()
        shell: powershell
        run: |
          Write-Host "❌ Staging deployment failed!"
          Write-Host "Logs:"

          kubectl logs -l app=api-gateway --tail=50 --namespace=$env:NAMESPACE

          # Rollback on failure
          kubectl rollout undo deployment/api-deployment --namespace=$env:NAMESPACE
