name: CI Pipeline

on:
  push:
    branches: [ main, Apurba, Andreas  ]
  pull_request:
    branches: [ main, Apurba, Andreas ]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort
      
      - name: Run Black (formatting check)
        run: |
          black --check --diff src/
        continue-on-error: true
      
      - name: Run Flake8 (linting)
        run: |
          flake8 src/ \
            --max-line-length=100 \
            --ignore=E203,W503,E501 \
            --exclude=__pycache__,*.pyc,.git,__init__.py
        continue-on-error: true
      
      - name: Run isort (import sorting)
        run: |
          isort --check-only --diff src/
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov pytest-asyncio httpx
      
      - name: Create test directories
        run: |
          mkdir -p tests/unit tests/integration
      
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term
        continue-on-error: true
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: 
          - name: orchestrator
            dockerfile: Dockerfile.api
          - name: xgb-service
            dockerfile: Dockerfile.xgb
          - name: hw-service
            dockerfile: Dockerfile.hw
          - name: gui
            dockerfile: Dockerfile.gui
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: energy-${{ matrix.service.name }}:${{ github.sha }}
          no-cache: true
          build-args: |
            SERVICE_NAME=${{ matrix.service.name }}
      
      - name: Test image
        run: |
          docker images | Select-String "energy-hw-service"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-fs-results.sarif'
        continue-on-error: true
      
      - name: Run Trivy vulnerability scanner (Python dependencies)
        run: |
          docker run --rm -v $(pwd):/src aquasec/trivy:latest \
            fs /src/requirements.txt \
            --severity CRITICAL,HIGH \
            --format table
        continue-on-error: true

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: always()
    
    steps:
      - name: Check CI status
        run: |
          echo "🎯 CI Pipeline Summary"
          echo "====================="
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
          
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed"
            exit 1
          fi