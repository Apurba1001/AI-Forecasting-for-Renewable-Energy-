services:
  orchestrator:
    image: energy-orchestrator
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - XGB_SERVICE_URL=http://xgb_service:8001
      - HW_SERVICE_URL=http://hw_service:8002
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - hw_service
      - xgb_service

  hw_service:
    image: energy-hw
    build: .
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app
    command: uvicorn src.api.lightweight_service:app --host 0.0.0.0 --port 8002

  xgb_service: 
    image: energy-xgb
    build: 
      context: .
      dockerfile: Dockerfile.xgb
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data       
      - ./models:/app/models    
      - ./src:/app/src          # 🔴 REQUIRED: Maps Code changes!
      - ./config.py:/app/config.py # (Optional but recommended)
    command: uvicorn src.api.xgboost_service:app --host 0.0.0.0 --port 8001 --reload

  gui:
    image: energy-gui
    build:
      context: .
      dockerfile: Dockerfile.gui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://orchestrator:8000
      - XGB_SERVICE_URL=http://xgb_service:8001
      - HW_SERVICE_URL=http://hw_service:8002
    depends_on:
      - orchestrator