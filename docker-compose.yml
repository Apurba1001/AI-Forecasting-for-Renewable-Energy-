

services:
  orchestrator:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - XGB_SERVICE_URL=http://xgb_service:8001
      - HW_SERVICE_URL=http://hw_service:8002
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - hw_service
      - xgb_service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: "5s"
      timeout: "2s"
      retries: 5

  hw_service:
    build: .
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app
    command: uvicorn src.api.lightweight_service:app --host 0.0.0.0 --port 8002

  xgb_service:
    build: .
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
    command: uvicorn src.api.xgboost_service:app --host 0.0.0.0 --port 8001

      # ✅ ADD THIS:
  gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://orchestrator:8000
      - XGB_SERVICE_URL=http://xgb_service:8001
      - HW_SERVICE_URL=http://hw_service:8002
    depends_on:
      - orchestrator